[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crewos"
version = "0.9.0"
description = "Mission control for your AI crew — 一人公司的 AI 团队操作系统"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "mcp>=1.0",
]

[project.scripts]
crewos = "crewos.cli:main"

[tool.setuptools]
packages = ["crewos"]

[tool.setuptools.package-data]
crewos = [
  "web/*.html",
  "templates/*",
  "templates/*/*",
  "templates/*/*/*",
  "templates/*/*/*/*",
]
